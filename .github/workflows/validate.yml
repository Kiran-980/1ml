name: Validate 1ml

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: package-and-tools
            modules: tests.test_package tests.test_tools tests.test_workflow tests.test_website
          - suite: notebook-delivery
            modules: tests.test_notebook_execution tests.test_eval_delivery tests.test_eval_notebook tests.test_eval_publish tests.test_eval_storage
          - suite: evaluation-contracts
            modules: tests.test_evals tests.test_eval_csv_split tests.test_eval_history tests.test_eval_regression_metrics
          - suite: model-replay
            modules: tests.test_eval_clustering tests.test_eval_forecasting tests.test_eval_regression tests.test_house_prices_evaluator
    name: ${{ matrix.suite }}
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest -v ${{ matrix.modules }}
