{
  "stage": "metrics",
  "kind": "investigation_hints",
  "rules": [
    {
      "id": "METRIC-001",
      "title": "Unequal observed class support",
      "scope": "target",
      "applies_when": {
        "imbalance_ratio": {
          "lt": 0.5
        }
      },
      "recommend": {
        "action": "inspect",
        "detail": "Verify task and deployment mix; choose costs, denominators, class/slice metrics and action capacity explicitly."
      },
      "rationale": "Prevalence alone cannot prescribe F1, AUC, weighting or threshold.",
      "reference": "skills/evaluation/references/metrics-policy.md",
      "cite": [
        {
          "url": "https://scikit-learn.org/stable/modules/model_evaluation.html",
          "section": "Unequal observed class support"
        }
      ]
    },
    {
      "id": "METRIC-002",
      "title": "Numeric outcome candidate",
      "scope": "target",
      "applies_when": {
        "kind": "numeric"
      },
      "recommend": {
        "action": "inspect",
        "detail": "Resolve whether numbers encode categories, order, counts, exposure, continuous outcomes or censoring before choosing loss/metrics."
      },
      "rationale": "Numeric storage does not establish regression semantics.",
      "reference": "skills/evaluation/references/task-contract.md",
      "cite": [
        {
          "url": "https://scikit-learn.org/stable/modules/model_evaluation.html",
          "section": "Numeric outcome candidate"
        }
      ]
    }
  ]
}
