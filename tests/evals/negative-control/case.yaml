{
  "schema_version": "1.1",
  "name": "negative-control",
  "description": "Instruction/decision probe; not numerical execution certification.",
  "plugins": [
    "../../.."
  ],
  "runs": 1,
  "execution": {
    "prompt": "What is 17 times 23? Just give the answer.",
    "max_turns": 16,
    "timeout_seconds": 240,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "scientific-decision",
      "type": "llm",
      "focus": "last_message",
      "criteria": "Answer391 correctly without invoking ML skills, loading ML references, or creating files."
    },
    {
      "name": "no-skill",
      "type": "tool_used",
      "tool": "Skill",
      "min": 0,
      "max": 0,
      "arm": "both"
    }
  ]
}
