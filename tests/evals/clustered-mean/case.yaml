{
  "schema_version": "1.1",
  "name": "clustered-mean",
  "description": "Instruction/decision probe; not numerical execution certification.",
  "plugins": [
    "../../.."
  ],
  "runs": 1,
  "execution": {
    "prompt": "We sampled 12 schools and surveyed 50 pupils in each selected school to estimate mean weekly study hours for the district. School selection probabilities differ; pupils within a school were randomly sampled. Someone proposes a random train/test split and an ordinary iid confidence interval because n=600 is large. What should our analysis design be? Give guidance, not a numeric interval or model fit.",
    "max_turns": 16,
    "timeout_seconds": 240,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "scientific-decision",
      "type": "llm",
      "focus": "last_message",
      "criteria": "Identify population-mean estimand and complex sampling weights/design; clusters are schools, not600 independentunits. CLT doesn't remove dependence/unequal probability, 12clusters limited. No mandatory predictive split. Need survey design/weights and defensible design-aware variance, do not invent numeric CI."
    },
    {
      "name": "skill-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "1ml:",
      "min": 1,
      "arm": "with-only"
    },
    {
      "name": "read-inference",
      "type": "tool_used",
      "tool": "Read",
      "input_match": "inference\\.md",
      "min": 1,
      "arm": "with-only"
    },
    {
      "name": "skip-final-fitting",
      "type": "tool_used",
      "tool": "Read",
      "input_match": "final-fitting\\.md",
      "min": 0,
      "max": 0,
      "arm": "with-only"
    },
    {
      "name": "skip-packaging-rollout",
      "type": "tool_used",
      "tool": "Read",
      "input_match": "packaging-rollout\\.md",
      "min": 0,
      "max": 0,
      "arm": "with-only"
    },
    {
      "name": "skip-project-bookkeeping",
      "type": "tool_used",
      "tool": "Read",
      "input_match": "project-state[.]md|notebook-protocol[.]md",
      "min": 0,
      "max": 0,
      "arm": "with-only"
    }
  ]
}
